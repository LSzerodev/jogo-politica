<style>

    background:rgba(6,10,24,.82);border:calc(2*var(--u)) solid rgba(255,255,255,.18);box-shadow:0 calc(12*var(--u)) calc(40*var(--u)) rgba(0,0,0,.5);backdrop-filter:blur(6px);

    background:linear-gradient(90deg,#6f93c6,#a9c4ea 40%,#86a8d8 70%,#5b7db2);box-shadow:0 calc(10*var(--u)) calc(30*var(--u)) rgba(0,0,0,.45);position:relative}
  .arm .sleeve::before{content:"";position:absolute;left:0;right:0;top:calc(16*var(--u));height:calc(26*var(--u));background:rgba(43,58,85,.25);border-top:calc(3*var(--u)) solid rgba(43,58,85,.5);border-bottom:calc(3*var(--u)) solid rgba(43,58,85,.5)}
  .sound{position:absolute;right:calc(24*var(--u));top:calc(214*var(--u));z-index:11;padding:calc(12*var(--u)) calc(20*var(--u));border-radius:calc(30*var(--u));border:1px solid rgba(255,255,255,.3);
    background:rgba(6,10,24,.85);font:700 calc(22*var(--u))/1 Barlow;letter-spacing:.08em;color:#fff;cursor:pointer;display:none}
  .sound.on{display:block}
  .av.img{background-size:cover;background-position:center}

  .offline{position:absolute;left:50%;top:calc(214*var(--u));transform:translateX(-50%);z-index:11;padding:calc(12*var(--u)) calc(22*var(--u));border-radius:calc(30*var(--u));background:#a00c16;font:700 calc(22*var(--u))/1 Barlow;white-space:nowrap;display:none}

<script type="module">
import * as THREE from 'three';
const V = (x,y,z)=>new THREE.Vector3(x,y,z);

function mesh(name, geo, mat, pos, rot, scl){
  const m = new THREE.Mesh(geo, mat); m.name = name;
  if(pos) m.position.set(...pos);
  if(rot) m.rotation.set(...rot);
  if(scl) m.scale.set(...scl);
  return m;
}
const S = (r,w=24,h=16,...a)=>new THREE.SphereGeometry(r,w,h,...a);
const C = (rt,rb,h,s=32)=>new THREE.CylinderGeometry(rt,rb,h,s);
const B = (x,y,z)=>new THREE.BoxGeometry(x,y,z);

// Illustration look: 3-tone cel shading + procedural fabric/hair textures
const GRAD = new THREE.DataTexture(new Uint8Array([70,70,70,255, 150,150,150,255, 215,215,215,255, 255,255,255,255]),4,1);
GRAD.minFilter=GRAD.magFilter=THREE.NearestFilter; GRAD.needsUpdate=true;
const rnd=(a,b)=>a+Math.random()*(b-a);
function tex(w,h,draw,rep=[1,1]){
  const c=document.createElement('canvas'); c.width=w; c.height=h; const g=c.getContext('2d');
  g.fillStyle='#fff'; g.fillRect(0,0,w,h); draw(g,w,h);
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(...rep);
  t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=4; return t;
}
const TX = {
  fabric: tex(256,256,(g,w,h)=>{
    for(let i=0;i<5000;i++){ const v=Math.floor(rnd(205,255)); g.fillStyle=`rgb(${v},${v},${v})`; g.fillRect(rnd(0,w),rnd(0,h),1,rnd(2,6)); }
    g.strokeStyle='rgba(0,0,0,0.06)'; g.lineWidth=1;
    for(let x=-h;x<w;x+=4){ g.beginPath(); g.moveTo(x,0); g.lineTo(x+h,h); g.stroke(); }
  },[6,6]),
  tieSilk: tex(128,128,(g,w,h)=>{
    g.strokeStyle='rgba(0,0,0,0.12)'; g.lineWidth=3;
    for(let x=-h;x<w;x+=10){ g.beginPath(); g.moveTo(x,h); g.lineTo(x+h,0); g.stroke(); }
    for(let i=0;i<800;i++){ g.fillStyle=`rgba(255,255,255,${rnd(0,0.3)})`; g.fillRect(rnd(0,w),rnd(0,h),1,1); }
  },[3,8]),
  tieWeave: tex(128,128,(g,w,h)=>{
    g.fillStyle='#c8c8c8'; g.fillRect(0,0,w,h);
    for(let y=0;y<h;y+=8) for(let x=(y/8)%2*4;x<w;x+=8){ g.fillStyle='#ffffff'; g.fillRect(x,y,4,4); g.fillStyle='rgba(0,0,0,0.25)'; g.fillRect(x+4,y+4,2,2); }
  },[3,10]),
  hair: tex(256,256,(g,w,h)=>{
    for(let i=0;i<900;i++){ const x=rnd(0,w), v=Math.floor(rnd(120,255)); g.strokeStyle=`rgba(${v},${v},${v},0.8)`; g.lineWidth=rnd(0.6,1.8);
      g.beginPath(); g.moveTo(x,rnd(0,h)); g.quadraticCurveTo(x+rnd(-12,12),rnd(0,h),x+rnd(-20,20),rnd(0,h)); g.stroke(); }
  },[4,2]),
  beard: tex(256,256,(g,w,h)=>{
    for(let i=0;i<6000;i++){ const v=Math.floor(rnd(110,255)); g.fillStyle=`rgb(${v},${v},${v})`; const x=rnd(0,w),y=rnd(0,h); g.fillRect(x,y,1.2,rnd(2,5)); }
  },[5,3]),
  skin: tex(128,128,(g,w,h)=>{
    for(let i=0;i<1500;i++){ g.fillStyle=`rgba(150,90,70,${rnd(0,0.08)})`; g.fillRect(rnd(0,w),rnd(0,h),2,2); }
  },[2,2]),
};
const INK = new THREE.MeshBasicMaterial({name:'ink_outline', color:'#141414', side:THREE.BackSide});
function addOutlines(root, skip){
  const list=[]; root.traverse(o=>{ if(o.isMesh && !skip.test(o.name)) list.push(o); });
  for(const m of list){
    m.geometry.computeBoundingSphere();
    const sc=Math.max(m.scale.x,m.scale.y,m.scale.z), r=m.geometry.boundingSphere.radius*sc;
    const o=new THREE.Mesh(m.geometry, INK); o.name=m.name+'_outline';
    const e=1+Math.min(0.12, 0.0075/Math.max(r,0.01)); o.scale.setScalar(e);
    o.castShadow=false; m.add(o);
  }
}

// Torso profile (radius, absolute y); depth scaled by ZS
const ZS = 0.66;
const prof = new THREE.SplineCurve([
  [0.205,0.78],[0.215,0.92],[0.205,1.04],[0.235,1.18],[0.285,1.34],[0.295,1.44],[0.255,1.53],[0.16,1.585],[0.075,1.6]
].map(p=>new THREE.Vector2(p[0],p[1])));
const profPts = prof.getPoints(80);
function R(y){
  for(let i=0;i<profPts.length-1;i++){
    const a=profPts[i], b=profPts[i+1];
    if(y>=a.y && y<=b.y){ const t=(y-a.y)/(b.y-a.y||1); return a.x+(b.x-a.x)*t; }
  }
  return y<profPts[0].y?profPts[0].x:profPts.at(-1).x;
}
const sp = (y,phi,off=0)=>{ const r=R(y)+off; return V(r*Math.sin(phi), y, r*Math.cos(phi)*ZS); };
function patch(y0,y1,phiFn,off,segY=24,segP=10){
  const pos=[], idx=[];
  for(let i=0;i<=segY;i++){
    const y=y0+(y1-y0)*i/segY, [p0,p1]=phiFn(y);
    for(let j=0;j<=segP;j++){ const v=sp(y,p0+(p1-p0)*j/segP,off); pos.push(v.x,v.y,v.z); }
  }
  const uv=[]; for(let i=0;i<=segY;i++) for(let j=0;j<=segP;j++) uv.push(j/segP, i/segY*3);
  for(let i=0;i<segY;i++) for(let j=0;j<segP;j++){
    const a=i*(segP+1)+j, b=a+segP+1;
    idx.push(a,a+1,b, a+1,b+1,b);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx); g.computeVertexNormals(); return g;
}

function starShape(r){
  const s=new THREE.Shape();
  for(let i=0;i<10;i++){ const a=Math.PI/2+i*Math.PI/5, rr=i%2?r*0.42:r;
    i?s.lineTo(Math.cos(a)*rr,Math.sin(a)*rr):s.moveTo(Math.cos(a)*rr,Math.sin(a)*rr); }
  return s;
}

function makeChar(id, cfg){
  const M = (n,c,r=0.7,m=0,extra={})=>new THREE.MeshToonMaterial({name:`${id}_${n}`,color:c,gradientMap:GRAD,...extra});
  const mat = {
    skin: M('skin',cfg.skin,0.6,0,{map:TX.skin}),
    suit: M('suit',cfg.suit,0.75,0,{side:THREE.DoubleSide,map:TX.fabric}),
    lapel: M('lapel',cfg.lapel,0.6,0,{side:THREE.DoubleSide,map:TX.fabric}),
    shirt: M('shirt','#f4f2ee',0.6,0,{side:THREE.DoubleSide}),
    tie: M('tie',cfg.tie,0.45,0,{side:THREE.DoubleSide,map:cfg.tieWeave?TX.tieWeave:TX.tieSilk}),
    hair: M('hair',cfg.hair,0.85,0,{map:TX.hair}),
    beard: M('beard',cfg.beard,0.9,0,{map:TX.beard}),
    shoe: new THREE.MeshPhongMaterial({name:`${id}_shoe`,color:'#141414',specular:'#9a9a9a',shininess:90}),
    eye: M('eyewhite','#f5f3ef',0.3),
    iris: M('iris',cfg.iris,0.25),
    mouth: M('mouth','#3a1414',0.8,0,{side:THREE.DoubleSide}),
    teeth: M('teeth','#f2efe6',0.35),
    tongue: M('tongue','#c9575c',0.5),
    lip: M('lip',cfg.lip,0.6),
  };
  const root = new THREE.Group(); root.name = id;

  // Legs
  const hip = mesh(`${id}_hips`, C(0.195,0.19,0.22), mat.suit, [0,0.88,0], null, [1,1,0.72]); root.add(hip);
  const legs = {};
  for(const side of [1,-1]){
    const L = side>0?'L':'R';
    const leg = new THREE.Group(); leg.name=`${id}_leg${L}`; leg.position.set(side*0.11,0.9,0); leg.rotation.z=side*0.09;
    leg.add(mesh(`${id}_thigh${L}`, C(0.118,0.088,0.45), mat.suit, [0,-0.225,0]));
    leg.add(mesh(`${id}_quad${L}`, S(0.1), mat.suit, [0,-0.2,0.03],null,[0.9,1.6,0.8]));
    const knee = new THREE.Group(); knee.position.y=-0.45; leg.add(knee);
    knee.add(mesh(`${id}_knee${L}`, S(0.088), mat.suit));
    knee.add(mesh(`${id}_shin${L}`, C(0.088,0.074,0.4), mat.suit, [0,-0.2,0]));
    const foot = new THREE.Group(); foot.position.y=-0.4; foot.rotation.z=-side*0.09; knee.add(foot);
    foot.add(mesh(`${id}_shoe${L}`, S(1), mat.shoe, [0,-0.008,0.045],null,[0.066,0.046,0.15]));
    foot.add(mesh(`${id}_sole${L}`, B(0.13,0.014,0.3), mat.shoe, [0,-0.046,0.045]));
    root.add(leg); legs[L]=leg; leg.knee=knee;
  }

  // Upper body (pivot at hip)
  const upper = new THREE.Group(); upper.name=`${id}_upper`; upper.position.y=0.95; root.add(upper);
  const U = new THREE.Group(); U.position.y=-0.95; upper.add(U);
  const lathe = new THREE.LatheGeometry(profPts, 48);
  U.add(mesh(`${id}_jacket`, lathe, mat.suit, null, null, [1,1,ZS]));
  const vW = y=>0.46*Math.max(0,(y-1.12)/(1.575-1.12));
  U.add(mesh(`${id}_shirtfront`, patch(1.12,1.575,y=>[-vW(y)-0.02,vW(y)+0.02],0.002), mat.shirt));
  U.add(mesh(`${id}_tie`, patch(1.13,1.53,y=>{const hw=(0.036-0.016*(y-1.13)/0.4)/R(y);return[-hw,hw];},0.006,12,4), mat.tie));
  U.add(mesh(`${id}_tieknot`, S(1,16,12), mat.tie, [0,1.55,R(1.55)*ZS+0.012],[0.3,0,0],[0.024,0.026,0.014]));
  for(const s of [1,-1]){
    U.add(mesh(`${id}_lapel${s>0?'L':'R'}`, patch(1.12,1.565,y=>{const w=vW(y),lw=(0.012+0.07*Math.max(0,(y-1.12)/0.44))/R(y);return s>0?[w,w+lw]:[-w-lw,-w];},0.007,20,4), mat.lapel));
    const pf = sp(0.97,s*0.78,0.006);
    U.add(mesh(`${id}_pocketflap${s>0?'L':'R'}`, B(0.13,0.04,0.012), mat.suit, [pf.x,pf.y,pf.z],[0,s*0.78*0.8,0]));
  }
  const cp = sp(1.36,0.68,0.006);
  U.add(mesh(`${id}_chestpocket`, B(0.09,0.012,0.01), mat.lapel, [cp.x,cp.y,cp.z],[0,0.55,0]));
  for(const y of [1.1,0.97]){ const b=sp(y,0,0.004); U.add(mesh(`${id}_button${y}`, C(0.012,0.012,0.006,20), mat.shoe, [b.x,b.y,b.z],[Math.PI/2,0,0])); }
  // Pin
  const pp = sp(1.46,0.62,0.01);
  const pin = new THREE.Group(); pin.name=`${id}_pin`; pin.position.copy(pp); pin.rotation.y=0.5; U.add(pin);
  if(cfg.pin==='star'){
    const red = M('pinred','#d4141c',0.4);
    pin.add(mesh(`${id}_pinstar`, new THREE.ExtrudeGeometry(starShape(0.022),{depth:0.005,bevelEnabled:false}), red));
  } else {
    const g = M('pingreen','#0f9b3a',0.45), yl = M('pinyellow','#f5d000',0.4), bl = M('pinblue','#1f3fa0',0.4);
    pin.add(mesh(`${id}_pinflag`, B(0.036,0.026,0.004), g));
    pin.add(mesh(`${id}_pindiamond`, B(0.017,0.017,0.004), yl, [0,0,0.003],[0,0,Math.PI/4],[1.35,0.9,1]));
    pin.add(mesh(`${id}_pinglobe`, C(0.006,0.006,0.003,20), bl, [0,0,0.006],[Math.PI/2,0,0]));
  }

  // Neck & collar
  U.add(mesh(`${id}_neck`, C(0.07,0.078,0.14), mat.skin, [0,1.63,0.0]));
  U.add(mesh(`${id}_collar`, C(0.082,0.088,0.06,32), mat.shirt, [0,1.59,0.0]));

  // Arms
  const arms = {};
  for(const side of [1,-1]){
    const L = side>0?'L':'R';
    const sh = new THREE.Group(); sh.name=`${id}_shoulder${L}`; sh.position.set(side*0.3,1.46,0); U.add(sh);
    sh.add(mesh(`${id}_deltoid${L}`, S(0.118), mat.suit, [side*0.01,0,0],null,[1,0.95,1]));
    sh.add(mesh(`${id}_upperarm${L}`, C(0.1,0.082,0.3), mat.suit, [0,-0.15,0]));
    sh.add(mesh(`${id}_bicep${L}`, S(0.09), mat.suit, [0,-0.15,0.02],null,[1,1.5,1.05]));
    const el = new THREE.Group(); el.position.y=-0.3; sh.add(el);
    el.add(mesh(`${id}_elbow${L}`, S(0.082), mat.suit));
    el.add(mesh(`${id}_forearm${L}`, C(0.084,0.062,0.28), mat.suit, [0,-0.14,0]));
    el.add(mesh(`${id}_cuff${L}`, C(0.058,0.058,0.03), mat.shirt, [0,-0.29,0]));
    const hand = new THREE.Group(); hand.position.y=-0.3; el.add(hand);
    hand.add(mesh(`${id}_fist${L}`, S(1), mat.skin, [0,-0.055,0.005],null,[0.048,0.062,0.056]));
    hand.add(mesh(`${id}_thumb${L}`, S(1,16,12), mat.skin, [-side*0.035,-0.05,0.03],null,[0.016,0.03,0.016]));
    const finger = mesh(`${id}_indexfinger${L}`, C(0.012,0.011,0.08,12), mat.skin, [-side*0.012,-0.135,0.02]);
    finger.visible=false; hand.add(finger);
    if(cfg.watch && side<0){
      el.add(mesh(`${id}_watch`, C(0.064,0.064,0.022), M('watch','#b9bcc2',0.3,0.4), [0,-0.26,0]));
    }
    arms[L]={sh,el,hand,finger};
  }

  // Head
  const neckPivot = new THREE.Group(); neckPivot.name=`${id}_headpivot`; neckPivot.position.y=1.62; U.add(neckPivot);

}

const POSES = {

  joy:    { lean:-0.1, head:[-0.32,0.15,0], g:{sx:-0.25,sz:2.5,ex:-0.1,ez:-0.45}, o:{sx:-0.25,sz:2.5,ex:-0.1,ez:-0.45}, point:false },
  tease:  { lean:0.04, head:[0,0.35,0.18], g:{sx:-1.45,sz:0.05,ex:-0.12,ez:0}, o:{sx:0.12,sz:0.72,ex:0,ez:-1.9}, point:true },
};
POSES.jamal={...POSES.joy};
const POCKET={sx:0.22,sz:0.3,ex:-0.45,ez:-0.45}, FIST={sx:0.05,sz:0.24,ex:-0.18,ez:0};
function targetsFor(c,p){
  if(p===POSES.neutral) p={...p,g:POCKET,o:c===Bc?POCKET:FIST};
  const t={upper:[p.lean,0,0],head:[p.head[0],c.gs*p.head[1],c.gs*p.head[2]]};
  for(const L of ['L','R']){ const side=L==='L'?1:-1, a=side===c.gs?p.g:p.o; t[L]={sh:[a.sx,0,side*a.sz],el:[a.ex,0,side*a.ez]}; }
  return t;
}
const lerpRot=(o,t,k)=>{ o.x+=(t[0]-o.x)*k; o.y+=(t[1]-o.y)*k; o.z+=(t[2]-o.z)*k; };
function setMode(c,m){
  if(c.mode===m) return; c.mode=m; c.t=targetsFor(c,POSES[m]);
  c.setFace(m==='jamal'?'joy':m, c.gs);
  for(const L of ['L','R']){ const side=L==='L'?1:-1; c.arms[L].finger.visible=POSES[m].point && side===c.gs; }
}
function jamal(c,time){
  const bpm=150, b=time*Math.PI*(bpm/60), s=Math.sin(b), k=0.35, bar=Math.floor(time*(bpm/60)/4)%2;
  const upL=Math.max(0,s), upR=Math.max(0,-s);
  c.root.position.y=Math.abs(s)*0.035;
  c.root.rotation.y+=(c.baseY*0.25-c.root.rotation.y)*0.08;
  lerpRot(c.upper.rotation,[0.14+Math.abs(s)*0.04,s*0.12,-s*0.05],k);
  lerpRot(c.head.rotation,[0.05+Math.abs(Math.sin(b*2))*0.06,0,s*0.08],k);
  c.legs.L.rotation.x+=(-0.55*upL-c.legs.L.rotation.x)*k; c.legs.R.rotation.x+=(-0.55*upR-c.legs.R.rotation.x)*k;
  c.legs.L.knee.rotation.x+=(1.0*upL-c.legs.L.knee.rotation.x)*k; c.legs.R.knee.rotation.x+=(1.0*upR-c.legs.R.knee.rotation.x)*k;
  for(const L of ['L','R']){ const side=L==='L'?1:-1, arm=c.arms[L]; let sh,el;
    if(bar===0){ const p=Math.abs(s); sh=[-0.35-0.25*p,0,side*(0.35+0.15*p)]; el=[-1.7+0.7*p,0,-side*0.35]; }
    else { sh=[-0.45,0,side*0.32+s*0.25]; el=[-1.5,0,s*0.9]; }
    lerpRot(arm.sh.rotation,sh,k); lerpRot(arm.el.rotation,el,k); }
}
function pose(c,time){
  const k=0.14, m=c.mode;
  c.kick*=0.82;
  c.root.position.y=c.kick*0.05; c.root.rotation.y+=(c.baseY-c.root.rotation.y)*k;
  for(const L of ['L','R']){ c.legs[L].rotation.x*=0.85; c.legs[L].knee.rotation.x*=0.85; }
  const wob = m==='anger'?Math.sin(time*14+c.gs)*0.07 : m==='joy'?Math.sin(time*5+c.gs)*0.08 : 0;
  lerpRot(c.upper.rotation,[c.t.upper[0]-c.kick*0.12+(m==='joy'?Math.sin(time*5)*0.02:0),0,0],k);
  lerpRot(c.head.rotation,[c.t.head[0],c.t.head[1],c.t.head[2]+(m==='tease'?Math.sin(time*2.5+c.gs)*0.07:0)],k);
  for(const L of ['L','R']){ const side=L==='L'?1:-1, isG=side===c.gs, s=c.t[L].sh;
    lerpRot(c.arms[L].sh.rotation,[s[0]+(isG||m==='joy'?wob:0),s[1],s[2]],k); lerpRot(c.arms[L].el.rotation,c.t[L].el,k); }
}

// ---------- Enquete ao vivo: o servidor conta os votos, a página só mostra ----------
const $=id=>document.getElementById(id);
const G={phase:'idle', v:{22:0,13:0}, top:{22:[],13:[]}, deadline:0, duration:0, restartAt:0, sides:null, audio:{music:80,gifts:100}};
const char={22:Bc,13:A};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
for(const s of [22,13]) $('rank'+s).innerHTML='<div class="row"><span class="av"></span><div class="who"><div class="nm"></div><div class="sb"></div></div></div>'.repeat(3);
function renderRank(side){

function render(){
  for(const s of [22,13]) $('v'+s).textContent=G.v[s];
  const tot=G.v[22]+G.v[13]; $('bar').style.width=(tot?G.v[22]/tot*100:50)+'%';
  const left=G.phase==='play'&&G.duration?Math.max(0,G.deadline-performance.now())/1000/G.duration:1;
  $('timer').style.transform='scaleX('+left+')';
}
function feed(html,cls){ const f=$('feed'), d=document.createElement('div'); d.className='c '+(cls||''); d.id='feed'; d.innerHTML=html; f.replaceWith(d); }
function hint(){ const k=s=>esc((G.sides&&G.sides[s].keywords[0])||s); return 'Comente <u class="b">'+k(22)+'</u> ou <u class="r">'+k(13)+'</u> para votar!'; }

// ---------- Mãos: cada voto é um toque no número da placa ----------
const ARM={22:{bx:70,by:2010,keys:['t22a','t22b'],i:0},13:{bx:1010,by:2010,keys:['t13a','t13b'],i:0}};
function aimArm(side,pressed){
  const a=ARM[side], ph=$('phone').getBoundingClientRect(), k=ph.width/1080, t=$(a.keys[a.i]).getBoundingClientRect();
  const tx=t.left-ph.left+t.width/2, ty=t.top-ph.top+t.height*0.55, bx=a.bx*k, by=a.by*k;
  const L=Math.hypot(tx-bx,by-ty), ang=Math.atan2(tx-bx,by-ty)*180/Math.PI, el=$('arm'+side);
  el.style.height=L+'px'; el.style.left=(bx-85*k)+'px'; el.style.top=(by-L)+'px';
  el.style.transform=`rotate(${ang}deg) translateY(${pressed?0:70*k}px)`;
}
function tap(side){
  const a=ARM[side]; a.i^=1; aimArm(side,true);
  $(a.keys[a.i]).animate([{transform:'scale(.9)',filter:'brightness(1.5)'},{transform:'none',filter:'none'}],{duration:240,easing:'ease-out'});
  clearTimeout(a.to); a.to=setTimeout(()=>aimArm(side,false),120);
}
new ResizeObserver(()=>{ aimArm(22,false); aimArm(13,false); }).observe($('phone'));

// ---------- Música de quem está ganhando (22 → direita, 13 → esquerda) ----------
const MUSIC={22:new Audio('/musica/direita'),13:new Audio('/musica/esquerda')};
for(const a of Object.values(MUSIC)){ a.loop=true; a.volume=0; }
let leader=0;
function playLeader(){
  if(!leader) return;
  MUSIC[leader].play().then(()=>$('sound').classList.remove('on')).catch(e=>{ if(e.name==='NotAllowedError') $('sound').classList.add('on'); });
}
function setLeader(s){ if(s===leader) return; leader=s; playLeader(); }
function fadeMusic(){
  const vol=G.audio.music/100;
  for(const s of [22,13]){ const a=MUSIC[s], to=s==leader?vol:0;
    a.volume=Math.min(1,Math.max(0,a.volume+(to-a.volume)*0.08));
    if(!to && a.volume<0.02 && !a.paused){ a.volume=0; a.pause(); } }
}
// Troca a música só quando a liderança fica clara (2+ votos), para não alternar a cada voto
function checkLeader(){
  const d=G.v[22]-G.v[13];
  if(!leader && d) setLeader(d>0?22:13);
  else if(leader && (leader==22?-d:d)>=2) setLeader(leader==22?13:22);
}
// Áudios dos presentes (no máximo 4 ao mesmo tempo para não virar barulho)
const playing=new Set();
function giftSound(url,volume){
  if(playing.size>=4) return;
  const a=new Audio(url); a.volume=Math.min(1,(volume/100)*(G.audio.gifts/100)); playing.add(a);
  const done=()=>playing.delete(a); a.onended=done; a.onerror=done;
  a.play().catch(e=>{ done(); if(e.name==='NotAllowedError') $('sound').classList.add('on'); });
}
// Navegadores bloqueiam áudio sem interação: qualquer toque libera (no OBS toca direto)
$('sound').onclick=playLeader; addEventListener('pointerdown',playLeader);

// ---------- Eventos do servidor ----------
function plus(side,amount){
  const r=$('phone').getBoundingClientRect(), t=$(ARM[side].keys[ARM[side].i]).getBoundingClientRect(), p=document.createElement('span');
  p.className='plus'+(amount>=10?' big':''); p.textContent='+'+amount;
  p.style.left=(t.left-r.left+t.width/2)+'px'; p.style.top=(t.top-r.top)+'px';
  $('phone').appendChild(p); setTimeout(()=>p.remove(),amount>=10?1100:600);
}
function onVote(e){
  const side=e.side; char[side].kick=1;
  G.v[side]+=e.amount; render(); checkLeader();
  const cls=side==22?'b':'r';
  feed(e.kind==='chat'?'<u>'+esc(e.name)+'</u> '+esc(e.text)
     : e.kind==='manual'?'<u>+'+e.amount+'</u> votos no '+side
     : '<u>'+esc(e.name)+'</u> '+esc(e.text)+' · <b>+'+e.amount+'</b>', cls);
  // presentes grandes: a mão toca várias vezes seguidas
  const taps=Math.min(6,Math.max(1,Math.ceil(Math.log2(e.amount+1))));
  for(let i=0;i<taps;i++) setTimeout(()=>tap(side),i*130);
  plus(side,e.amount);
}
let countIv=0, restartIv=0;
function onPhase(e){
  clearInterval(countIv); clearInterval(restartIv);
  $('ovCount').classList.remove('on'); $('ovRes').classList.remove('on'); $('ovIdle').classList.remove('on');
  if(e.phase==='count'){
    G.v={22:0,13:0}; setLeader(0); feed(hint());
    for(const c of [A,Bc]) setMode(c,'neutral');
    let n=3; $('ovCount').classList.add('on'); $('count').textContent=n;
    countIv=setInterval(()=>{ n--; if(n>0) $('count').textContent=n; else { clearInterval(countIv); $('ovCount').classList.remove('on'); } },700);
  } else if(e.phase==='play'){
    feed(hint());
  } else if(e.phase==='end'){
    const w=e.winner;
    if(w){ setLeader(w); setMode(char[w],'jamal'); setMode(char[w==22?13:22],'anger'); } else { setMode(A,'anger'); setMode(Bc,'anger'); }
    $('rw').textContent=w?(w+' venceu!'):'Empate!';
    $('rw').style.color=w==22?'#6fb0ff':w==13?'#ff6b74':'#fff';
    $('rm').textContent=G.v[22]+' × '+G.v[13]+(e.top?' · Quem mais votou: '+e.top.name+' ('+e.top.n+')':'');
    $('ovRes').classList.add('on'); restartLabel();
    restartIv=setInterval(restartLabel,500);
  } else {
    setLeader(0); for(const c of [A,Bc]) setMode(c,'neutral');
    $('ovIdle').classList.add('on'); feed('Aguardando a próxima enquete…');
  }
}
function restartLabel(){
  const n=Math.ceil((G.restartAt-performance.now())/1000);
  $('again').textContent=G.restartAt&&n>0?'Nova enquete em '+n+'…':G.restartAt?'Começando…':'Aguardando a próxima enquete';
}
function onState(s){
  G.v=s.v; G.top=s.top; G.duration=s.duration; G.sides=s.sides; G.audio=s.audio;
  G.deadline=s.remaining==null?0:performance.now()+s.remaining;
  G.restartAt=s.restartIn==null?0:performance.now()+s.restartIn;
  for(const k of [22,13]) $('lbl'+k).textContent=s.sides[k].label;
  if(!G.synced){ G.synced=true; G.phase=s.phase; onPhase({phase:s.phase, winner:s.winner}); }
  G.phase=s.phase; renderRank(22); renderRank(13); render(); checkLeader();
}
function connect(){
  const es=new EventSource('/events');
  es.addEventListener('state',e=>onState(JSON.parse(e.data)));
  es.addEventListener('vote',e=>onVote(JSON.parse(e.data)));
  es.addEventListener('phase',e=>{ const d=JSON.parse(e.data); G.phase=d.phase; onPhase(d); });
  es.addEventListener('sound',e=>{ const d=JSON.parse(e.data); giftSound(d.url,d.volume); });
  es.addEventListener('notice',e=>{ const d=JSON.parse(e.data); feed('<u>'+esc(d.name)+'</u> '+esc(d.text)); });
  es.onopen=()=>$('offline').classList.remove('on');
  es.onerror=()=>{ $('offline').classList.add('on'); G.synced=false; };
}

let last=performance.now(), t0=last, react=0;
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now; const time=(now-t0)/1000;
  if(G.phase==='play'){
    if((react-=dt)<=0){ react=0.35;
      const d=G.v[22]-G.v[13], lead22=d>0, abs=Math.abs(d);
      const top=lead22?Bc:A, low=lead22?A:Bc;
      if(abs<3){ setMode(A,'neutral'); setMode(Bc,'neutral'); }
      else { setMode(top, abs>10?'tease':'joy'); setMode(low,'anger'); }
    }
    render();
  }
  fadeMusic();
  for(const c of [A,Bc]) c.mode==='jamal'?jamal(c,time):pose(c,time);
  renderer.render(scene,cam);
  requestAnimationFrame(loop);
}
connect(); requestAnimationFrame(loop);
</script>

</body></html>
